_target_: dl_template.models.simple_cnn.SimpleCNN
_recursive_: false

net_cfg:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torch.nn.Conv2d
      in_channels: 1
      out_channels: 32
      kernel_size: 3
      stride: 1
      padding: 1
    - _target_: torch.nn.ReLU
    - _target_: torch.nn.MaxPool2d
      kernel_size: 2
      stride: 2
    - _target_: torch.nn.Conv2d
      in_channels: 32
      out_channels: 64
      kernel_size: 3
      stride: 1
      padding: 1
    - _target_: torch.nn.ReLU
    - _target_: torch.nn.MaxPool2d
      kernel_size: 2
      stride: 2
    - _target_: torch.nn.Flatten
    - _target_: torch.nn.Linear
      in_features: 3136 # 64 * 7 * 7
      out_features: 10

optimizer_cfg:
  _target_: torch.optim.Adam
  lr: 0.001

scheduler_cfg:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: "min"
  factor: 0.1
  patience: 10
