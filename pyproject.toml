[project]
name = "dl-template"
version = "0.1.0"
description = "A template repository for deep learning projects."
authors = [{ name = "Jules", email = "jules@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
# Optional: specify where to find packages
# index-url = "https://pypi.org/simple"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# B for bugbear, I for isort, UP for pyupgrade
select = ["E", "F", "B", "I", "UP"]
# Allow autofix for all enabled rules (when `--fix`) is used.
fixable = ["ALL"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"
# Like Black, use trailing commas for multi-line expressions.
trailing-comma = "all"

[tool.pytest.ini_options]
pythonpath = ["src"]
